<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Banner & Trang Chủ CLB STEM</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: #f8fafc; }
        .card-bg { background-color: #0f172a; border: 1px solid #1e293b; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <!-- FORM CHỈNH SỬA BANNER TRANG CHỦ -->
    <div class="card-bg w-full max-w-2xl rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
            <span class="text-2xl">✏️</span>
            <h2 class="text-xl md:text-2xl font-bold text-amber-400">Chỉnh Sửa Banner Trang Chủ</h2>
        </div>

        <form id="banner-form" onsubmit="handleSaveBanner(event)" class="space-y-5">
            <!-- Tiêu đề chính -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Tiêu đề chính</label>
                <input type="text" id="banner-title" required placeholder="CLB STEM THTH ĐHSP" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400 font-medium">
            </div>

            <!-- Mô tả tóm tắt -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Mô tả tóm tắt</label>
                <textarea id="banner-desc" rows="3" placeholder="Chào mừng bạn đến với không gian chia sẻ kiến thức..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400 font-medium resize-none"></textarea>
            </div>

            <!-- Tải ảnh Banner -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Tải Ảnh Banner Từ Máy Tính hoặc Dán Link URL</label>
                
                <div class="flex items-center gap-3 mb-3">
                    <input type="file" id="banner-file-input" accept="image/*" onchange="handleProcessAndCompressImage(event)" class="hidden">
                    <label for="banner-file-input" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs cursor-pointer transition shadow-md shrink-0">
                        Chọn tệp
                    </label>
                    <span id="file-name-display" class="text-xs text-slate-400 truncate">Chưa chọn tệp nào</span>
                </div>

                <!-- Thông báo trạng thái -->
                <div id="upload-status" class="hidden text-xs mb-2 font-medium"></div>

                <!-- Input chứa Base64 / URL ảnh -->
                <input type="text" id="banner-url-input" placeholder="Hoặc dán URL ảnh / Chuỗi mã hóa sẽ tự tạo ở đây..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-300 focus:outline-none focus:border-amber-400 font-mono text-xs">
            </div>

            <!-- Preview Ảnh -->
            <div id="preview-container" class="hidden space-y-2">
                <label class="block text-xs font-semibold text-slate-400">Xem trước ảnh Banner:</label>
                <div class="w-full h-48 rounded-xl overflow-hidden border border-slate-700 bg-slate-900">
                    <img id="banner-preview" src="" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Nút Hành Động -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                <button type="button" onclick="loadBannerData()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition">
                    Hủy / Tải lại
                </button>
                <button type="submit" id="btn-save" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 text-sm font-bold rounded-xl shadow-lg shadow-amber-500/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Banner
                </button>
            </div>
        </form>
    </div>

    <!-- SCRIPT XỬ LÝ FIREBASE DATABASE & NÉN ẢNH AUTOMATIC -->
    <script>
        // Đường dẫn Firebase Realtime DB của bạn
        const FIREBASE_DB_URL = "https://stem-ththdhsp-page-default-rtdb.asia-southeast1.firebasedatabase.app/banner.json";

        // 1. TẢI DỮ LIỆU BANNER TỪ FIREBASE KHI TRANG LOAD
        async function loadBannerData() {
            try {
                const res = await fetch(FIREBASE_DB_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data) {
                        if (data.title) document.getElementById('banner-title').value = data.title;
                        if (data.desc) document.getElementById('banner-desc').value = data.desc;
                        if (data.imageUrl) {
                            document.getElementById('banner-url-input').value = data.imageUrl;
                            showPreview(data.imageUrl);
                        }
                    }
                }
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu từ Firebase:", err);
            }
        }

        // 2. TỰ ĐỘNG NÉN ẢNH ĐỂ KHÔNG BỊ FIREBASE CHẶN DUNG LƯỢNG
        function handleProcessAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('file-name-display').innerText = file.name;
            const statusEl = document.getElementById('upload-status');
            statusEl.classList.remove('hidden');
            statusEl.className = "text-xs mb-2 font-medium text-amber-400";
            statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tối ưu dung lượng ảnh cho Firebase...`;

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;

                img.onload = function () {
                    // Tạo Canvas resize ảnh
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Resize chiều rộng chuẩn Banner (Tối đa 1200px)
                    const maxWidth = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Nén định dạng JPEG 65% (Siêu nhẹ ~80KB, Firebase nhận trong 0.1s)
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);

                    document.getElementById('banner-url-input').value = compressedBase64;
                    showPreview(compressedBase64);

                    statusEl.className = "text-xs mb-2 font-medium text-emerald-400";
                    statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Đã xử lý & nén ảnh thành công! Bạn có thể bấm "Lưu Banner".`;
                };
            };

            reader.onerror = function () {
                statusEl.className = "text-xs mb-2 font-medium text-rose-500";
                statusEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Lỗi không đọc được file ảnh này!`;
            };
        }

        function showPreview(url) {
            const previewBox = document.getElementById('preview-container');
            const previewImg = document.getElementById('banner-preview');
            if (url) {
                previewImg.src = url;
                previewBox.classList.remove('hidden');
            }
        }

        // 3. LƯU BANNER LÊN FIREBASE REALTIME DATABASE
        async function handleSaveBanner(e) {
            e.preventDefault();

            const btnSave = document.getElementById('btn-save');
            const title = document.getElementById('banner-title').value.trim();
            const desc = document.getElementById('banner-desc').value.trim();
            const imageUrl = document.getElementById('banner-url-input').value.trim();

            btnSave.disabled = true;
            btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...`;

            const payload = {
                title: title,
                desc: desc,
                imageUrl: imageUrl,
                updatedAt: new Date().toISOString()
            };

            try {
                // Đẩy dữ liệu qua Fetch API REST của Firebase
                const res = await fetch(FIREBASE_DB_URL, {
                    method: 'PUT', // Ghi đè thông tin node banner
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("🎉 Đã lưu Banner thành công lên Firebase!");
                } else {
                    alert("❌ Lỗi khi gửi dữ liệu lên Firebase Database!");
                }
            } catch (err) {
                console.error(err);
                alert("❌ Lỗi kết nối Firebase: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Lưu Banner`;
            }
        }

        // Tự động tải dữ liệu banner khi mở trang
        document.addEventListener('DOMContentLoaded', loadBannerData);
    </script>
</body>
</html>

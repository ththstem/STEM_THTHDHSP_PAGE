<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLB STEM THTH ĐHSP</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="STEM_THTHDHSP_LOGO.png">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Shrikhand&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK (COMPAT VERSION) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root { --font-shrikhand: 'Shrikhand', cursive; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #060b13;
            color: #f1f5f9;
            overflow-x: hidden;
        }
        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;
        }
        .noders-title-main {
            font-family: var(--font-shrikhand); color: #ffffff; letter-spacing: 0.02em;
            text-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
        }
        .active-tab { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: white !important; 
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); 
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.6); transition: all 0.3s ease;
        }
        .glass-card:hover { border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <canvas id="particle-canvas"></canvas>

    <!-- HEADER -->
    <header class="bg-slate-950/90 border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-2xl text-white">
        <div class="max-w-[95%] mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-6">
            <div class="flex items-center gap-4 cursor-pointer" onclick="navigateTo('home')">
                <div class="w-14 h-14 bg-blue-500/10 rounded-2xl p-2 flex items-center justify-center border border-blue-500/40 overflow-hidden shrink-0">
                    <img src="STEM_THTHDHSP_LOGO.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/150?text=STEM'">
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-['Shrikhand',cursive] text-white">CLB STEM <span class="text-white">THTH ĐHSP</span></h1>
                    <div class="flex items-center gap-2 text-xs text-slate-400 mt-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        Cập nhật: <span id="last-updated-time" class="text-white">Đang đồng bộ...</span>
                    </div>
                </div>
            </div>

            <nav class="flex bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                <button onclick="navigateTo('home')" id="nav-home" class="px-5 py-2 rounded-xl text-xs font-bold transition text-white">Trang Chủ</button>
                <button onclick="navigateTo('stem')" id="nav-stem" class="px-5 py-2 rounded-xl text-xs font-bold text-white transition">Hoạt Động & Sự Kiện</button>
                <button onclick="navigateTo('sp')" id="nav-sp" class="px-5 py-2 rounded-xl text-xs font-bold text-white transition">Sản Phẩm Kỹ Thuật</button>
            </nav>

            <button id="btn-auth" onclick="toggleAdminLogin()" class="px-4 py-2 bg-amber-500/10 border border-amber-500/40 text-amber-400 hover:bg-amber-500 hover:text-white text-xs font-bold rounded-xl transition">
                <i class="fa-solid fa-lock" id="admin-auth-icon"></i> <span id="admin-auth-text">Admin Login</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-[95%] mx-auto px-4 py-8 flex-1 w-full relative z-10">
        <div id="app-content">
            <div class="text-center py-20 text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                <p class="text-sm">Đang kết nối Firebase Realtime Database...</p>
            </div>
        </div>
    </main>

    <!-- MODAL BANNER -->
    <div id="hero-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6">
            <h2 class="text-xl font-bold mb-4 text-amber-400">✏️ Chỉnh Sửa Banner Trang Chủ</h2>
            <form onsubmit="handleHeroSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Tiêu đề chính</label>
                    <input type="text" id="hero-title" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Mô tả tóm tắt</label>
                    <textarea id="hero-desc" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">URL Ảnh Banner (mỗi URL 1 dòng)</label>
                    <textarea id="hero-image-urls" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('hero-modal')" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Hủy</button>
                    <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-xl text-xs">Lưu Banner</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL THÊM/SỬA BÀI VIẾT -->
    <div id="item-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-xl font-bold text-blue-400">Thêm Bài Viết Mới</h2>
                <button onclick="closeModal('item-modal')" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="item-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="form-id">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-400 mb-1">Tiêu đề bài viết</label>
                        <input type="text" id="form-title" required placeholder="Nhập tiêu đề..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">Chuyên Mục</label>
                        <select id="form-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                            <option value="stem">Hoạt Động & Sự Kiện</option>
                            <option value="sp">Sản Phẩm Kỹ Thuật</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">URL Danh sách Ảnh (mỗi URL 1 dòng)</label>
                    <textarea id="form-image-urls" rows="2" placeholder="https://example.com/image1.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Tóm tắt ngắn</label>
                    <textarea id="form-summary" rows="2" required placeholder="Nhập mô tả tóm tắt..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Nội dung chi tiết</label>
                    <textarea id="form-content" rows="5" placeholder="Nhập nội dung chi tiết bài viết ở đây..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal('item-modal')" class="px-5 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Hủy</button>
                    <button type="submit" id="btn-submit-post" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-blue-600/20">Lưu Bài Viết</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT FIREBASE LOGIC CHUẨN FIX -->
    <script>
        // --- 1. CONFIG FIREBASE ---
        const firebaseConfig = {
            databaseURL: "https://stem-ththdhsp-page-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdmin = false; 
        let appData = {
            hero: {
                title: "CLB STEM THTH ĐHSP",
                desc: "Chào mừng bạn đến với không gian chia sẻ kiến thức, dự án kỹ thuật và các hoạt động sáng tạo của CLB STEM THTH ĐHSP.",
                images: ["STEM_THTHDHSP_LOGO.png"]
            },
            stem: [],
            sp: []
        };

        // --- 2. LẮNG NGHE DỮ LIỆU TỪ FIREBASE (FIX LỖI XÓA SẠCH DỮ LIỆU KHI F5) ---
        db.ref('stem_club').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                // Chuyển Object của Firebase thành Mảng JS có kèm ID để dễ render
                const parseFirebaseList = (obj) => {
                    if (!obj) return [];
                    return Object.keys(obj).map(key => ({
                        id: key,
                        ...obj[key]
                    }));
                };

                appData.hero = data.hero || appData.hero;
                appData.stem = parseFirebaseList(data.stem);
                appData.sp = parseFirebaseList(data.sp);
            } else {
                // Nếu Database rỗng hoàn toàn trên Server mới tạo mặc định 1 lần duy nhất
                db.ref('stem_club/hero').set(appData.hero);
            }

            updateTimestamp();
            handleRouting();
        });

        // --- 3. XỬ LÝ THÊM / SỬA BÀI VIẾT VÀO FIREBASE (FIX LỖI MẤT BÀI) ---
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('form-id').value;
            const category = document.getElementById('form-category').value; // 'stem' hoặc 'sp'
            const title = document.getElementById('form-title').value.trim();
            const summary = document.getElementById('form-summary').value.trim();
            const content = document.getElementById('form-content').value.trim();
            
            const rawImages = document.getElementById('form-image-urls').value.trim();
            const images = rawImages ? rawImages.split('\n').map(url => url.trim()).filter(url => url) : ["STEM_THTHDHSP_LOGO.png"];

            const payload = {
                title,
                summary,
                content,
                images,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            };

            const submitBtn = document.getElementById('btn-submit-post');
            submitBtn.disabled = true;
            submitBtn.innerText = "Đang lưu...";

            if (id) {
                // CẬP NHẬT (SỬA BÀI CŨ THEO ID)
                db.ref(`stem_club/${category}/${id}`).update(payload)
                    .then(() => finishSubmit())
                    .catch(err => alert("Lỗi khi cập nhật: " + err.message));
            } else {
                // THÊM MỚI (DÙNG PUSH ĐỂ TẠO ID RIÊNG BIỆT KHÔNG SỢ ĐÈ)
                payload.createdAt = firebase.database.ServerValue.TIMESTAMP;
                db.ref(`stem_club/${category}`).push(payload)
                    .then(() => finishSubmit())
                    .catch(err => alert("Lỗi khi tạo mới: " + err.message));
            }

            function finishSubmit() {
                submitBtn.disabled = false;
                submitBtn.innerText = "Lưu Bài Viết";
                closeModal('item-modal');
                document.getElementById('item-form').reset();
            }
        }

        // --- 4. XÓA BÀI VIẾT VĨNH VIỄN BẰNG ID ---
        function deletePost(category, id) {
            if (confirm("Bạn có chắc chắn muốn xóa bài viết này vĩnh viễn?")) {
                db.ref(`stem_club/${category}/${id}`).remove()
                    .then(() => alert("Đã xóa bài viết thành công!"))
                    .catch(err => alert("Lỗi khi xóa: " + err.message));
            }
        }

        // --- 5. LƯU HERO BANNER ---
        function handleHeroSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('hero-title').value.trim();
            const desc = document.getElementById('hero-desc').value.trim();
            const rawImages = document.getElementById('hero-image-urls').value.trim();
            const images = rawImages ? rawImages.split('\n').map(url => url.trim()).filter(url => url) : ["STEM_THTHDHSP_LOGO.png"];

            db.ref('stem_club/hero').set({ title, desc, images })
                .then(() => closeModal('hero-modal'))
                .catch(err => alert("Lỗi lưu banner: " + err.message));
        }

        // --- ROUTING VÀ RENDER UI ---
        window.addEventListener('hashchange', handleRouting);

        function navigateTo(path) { window.location.hash = path; }

        function handleRouting() {
            const hash = window.location.hash.replace('#', '') || 'home';
            const container = document.getElementById('app-content');
            
            ['home', 'stem', 'sp'].forEach(tab => {
                const el = document.getElementById(`nav-${tab}`);
                if (el) el.className = (tab === hash) 
                    ? "px-5 py-2 rounded-xl text-xs font-bold transition active-tab text-white" 
                    : "px-5 py-2 rounded-xl text-xs font-bold text-white transition";
            });

            if (hash === 'sp' || hash === 'stem') {
                renderListView(container, hash);
            } else {
                renderHomeView(container);
            }
        }

        function renderHomeView(container) {
            const hero = appData.hero;
            const stemList = appData.stem || [];
            const spList = appData.sp || [];

            container.innerHTML = `
                <div class="space-y-8 fade-in">
                    <!-- HERO BANNER -->
                    <div class="glass-card rounded-3xl p-6 md:p-8 relative overflow-hidden border border-slate-800">
                        ${isAdmin ? `
                            <button onclick="openHeroModal()" class="absolute top-4 right-4 z-20 px-3 py-1.5 bg-amber-500/20 text-amber-300 rounded-xl text-xs font-bold border border-amber-500/40">
                                <i class="fa-solid fa-pen"></i> Sửa Banner
                            </button>
                        ` : ''}

                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
                            <div class="lg:col-span-7 space-y-4">
                                <h2 class="noders-title-main text-2xl md:text-3xl">${hero.title}</h2>
                                <p class="text-slate-300 text-xs md:text-sm leading-relaxed">${hero.desc}</p>
                            </div>
                            <div class="lg:col-span-5">
                                <div class="h-48 rounded-2xl overflow-hidden border border-slate-700 bg-slate-950">
                                    <img src="${hero.images[0] || 'STEM_THTHDHSP_LOGO.png'}" class="w-full h-full object-cover">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- DANH SÁCH TÓM TẮT -->
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-bold text-blue-400">Hoạt Động Mới Nhất</h3>
                        ${isAdmin ? `
                            <button onclick="openPostModal('stem')" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-blue-600/30">
                                <i class="fa-solid fa-plus"></i> Thêm Bài Viết
                            </button>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${stemList.length === 0 ? '<p class="text-xs text-slate-500 col-span-3">Chưa có bài viết hoạt động nào.</p>' : ''}
                        ${stemList.map(item => `
                            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <img src="${(item.images && item.images[0]) || 'STEM_THTHDHSP_LOGO.png'}" class="w-full h-36 object-cover rounded-xl mb-3">
                                    <h4 class="font-bold text-sm text-white mb-1 line-clamp-1">${item.title}</h4>
                                    <p class="text-xs text-slate-400 line-clamp-2">${item.summary}</p>
                                </div>
                                ${isAdmin ? `
                                    <div class="flex justify-end gap-2 pt-3 mt-3 border-t border-slate-800">
                                        <button onclick="openPostModal('stem', '${item.id}')" class="text-amber-400 text-xs font-bold px-2 py-1 bg-amber-400/10 rounded-lg">Sửa</button>
                                        <button onclick="deletePost('stem', '${item.id}')" class="text-rose-400 text-xs font-bold px-2 py-1 bg-rose-400/10 rounded-lg">Xóa</button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderListView(container, cat) {
            const list = appData[cat] || [];
            const title = cat === 'stem' ? 'Hoạt Động & Sự Kiện' : 'Sản Phẩm Kỹ Thuật';

            container.innerHTML = `
                <div class="space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-blue-400">${title}</h2>
                        ${isAdmin ? `
                            <button onclick="openPostModal('${cat}')" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-blue-600/30">
                                <i class="fa-solid fa-plus"></i> Thêm Bài Viết Mới
                            </button>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${list.length === 0 ? '<p class="text-xs text-slate-500 col-span-3">Chưa có dữ liệu trong mục này.</p>' : ''}
                        ${list.map(item => `
                            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <img src="${(item.images && item.images[0]) || 'STEM_THTHDHSP_LOGO.png'}" class="w-full h-40 object-cover rounded-xl mb-3">
                                    <h4 class="font-bold text-sm text-white mb-1">${item.title}</h4>
                                    <p class="text-xs text-slate-400 line-clamp-3 mb-2">${item.summary}</p>
                                </div>
                                ${isAdmin ? `
                                    <div class="flex justify-end gap-2 pt-3 mt-3 border-t border-slate-800">
                                        <button onclick="openPostModal('${cat}', '${item.id}')" class="text-amber-400 text-xs font-bold px-2.5 py-1 bg-amber-400/10 rounded-lg">Sửa</button>
                                        <button onclick="deletePost('${cat}', '${item.id}')" class="text-rose-400 text-xs font-bold px-2.5 py-1 bg-rose-400/10 rounded-lg">Xóa</button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- HELPER MODAL & ADMIN AUTH ---
        function openPostModal(cat, id = null) {
            document.getElementById('form-category').value = cat;
            document.getElementById('form-id').value = id || '';
            
            if (id) {
                const item = appData[cat].find(i => i.id === id);
                if (item) {
                    document.getElementById('modal-title').innerText = "Chỉnh Sửa Bài Viết";
                    document.getElementById('form-title').value = item.title || '';
                    document.getElementById('form-summary').value = item.summary || '';
                    document.getElementById('form-content').value = item.content || '';
                    document.getElementById('form-image-urls').value = (item.images || []).join('\n');
                }
            } else {
                document.getElementById('modal-title').innerText = "Thêm Bài Viết Mới";
                document.getElementById('item-form').reset();
            }
            
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function openHeroModal() {
            document.getElementById('hero-title').value = appData.hero.title || '';
            document.getElementById('hero-desc').value = appData.hero.desc || '';
            document.getElementById('hero-image-urls').value = (appData.hero.images || []).join('\n');
            document.getElementById('hero-modal').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function toggleAdminLogin() {
            isAdmin = !isAdmin;
            document.getElementById('admin-auth-text').innerText = isAdmin ? "Admin (Online)" : "Admin Login";
            handleRouting();
        }

        function updateTimestamp() {
            const now = new Date();
            const el = document.getElementById('last-updated-time');
            if (el) el.innerText = now.toLocaleTimeString('vi-VN') + ' - ' + now.toLocaleDateString('vi-VN');
        }
    </script>
</body>
</html>
